name: iOS CI Diagnostic

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: SocialControl-v0.3-CI/SocialControl-v0.3-CI

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Comprobar Bundle ID de Insights
        run: |
          echo "===== BUILD SETTINGS SOCIALCONTROLREPORT ====="
          xcodebuild \
            -project SocialControl.xcodeproj \
            -target SocialControlReport \
            -sdk iphonesimulator \
            -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|PRODUCT_NAME"

      - name: Compilar y diagnosticar
        run: |
          set +e

          xcodebuild \
            -project SocialControl.xcodeproj \
            -scheme SocialControl \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          BUILD_EXIT=$?

          echo ""
          echo "===== BUSCANDO INFO.PLIST DE INSIGHTS ====="

          find ~/Library/Developer/Xcode/DerivedData \
            -path "*SocialControlReport.appex/Info.plist" \
            -print \
            -exec /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" {} \; \
            -exec /usr/libexec/PlistBuddy -c "Print :CFBundleName" {} \; || true

          echo ""
          echo "===== INFO.PLIST FUENTE ====="
          cat DeviceActivityReportExtension/Info.plist

          exit $BUILD_EXIT
