name: iOS Simulator Screenshot

on:
  push:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: SocialControl-v0.3-CI/SocialControl-v0.3-CI

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar app para simulador
        run: |
          xcodebuild \
            -project SocialControl.xcodeproj \
            -scheme SocialControl \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Arrancar simulador
        run: |
          xcrun simctl boot "iPhone 16" || true
          open -a Simulator
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Instalar app
        run: |
          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "SocialControl.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          xcrun simctl install booted "$APP_PATH"

      - name: Lanzar app
        run: |
          xcrun simctl launch booted com.yourcompany.SocialControl
          sleep 5

      - name: Hacer screenshot
        run: |
          xcrun simctl io booted screenshot screenshot.png

      - name: Subir screenshot
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: SocialControl-v0.3-CI/SocialControl-v0.3-CI/screenshot.png
